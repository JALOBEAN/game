<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Easter Eggs</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
    }

    header {
        text-align: center;
        padding: 25px 10px;
        border-bottom: 1px solid #333;
    }

    header h1 {
        margin: 0;
        font-size: 42px;
    }

    .container {
        display: flex;
        gap: 25px;
        padding: 25px;
        max-width: 1400px;
        margin: auto;
    }

    .box {
        background: #111;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }

    .left {
        width: 60%;
    }

    .right {
        width: 40%;
    }

    .box h2 {
        margin-top: 0;
        font-size: 25px;
        border-bottom: 1px solid #333;
        padding-bottom: 12px;
    }

    #document {
        min-height: 400px;
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 17px;
    }

    .egg {
        background: #191919;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 15px;
    }

    .egg h3 {
        margin-top: 0;
        font-size: 22px;
    }

    .egg p {
        line-height: 1.5;
    }

    .editor {
        display: none;
        margin-top: 20px;
    }

    textarea {
        width: 100%;
        min-height: 350px;
        resize: vertical;
        background: #050505;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 15px;
        font-family: monospace;
        font-size: 15px;
    }

    input {
        width: 100%;
        background: #050505;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        font-size: 16px;
    }

    button {
        background: #222;
        color: white;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 11px 18px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background: #333;
    }

    .secret-area {
        margin-top: 30px;
        border-top: 1px solid #333;
        padding-top: 20px;
    }

    .status {
        margin-top: 10px;
        color: #aaa;
        font-size: 14px;
    }

    .empty {
        color: #aaa;
        font-style: italic;
        padding: 20px 0;
    }

    @media (max-width: 800px) {
        .container {
            flex-direction: column;
        }

        .left,
        .right {
            width: 100%;
        }

        header h1 {
            font-size: 32px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Google Easter Eggs</h1>
</header>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="box left">
        <h2>Easter Egg Document</h2>

        <div id="document">
            Loading...
        </div>

        <!-- SECRET EDITOR -->
        <div class="secret-area">
            <input
                type="password"
                id="secretInput"
                placeholder="Enter code"
            >

            <button onclick="checkSecret()">Unlock Editor</button>

            <div class="editor" id="editor">
                <h2>Edit Easter Eggs</h2>

                <textarea id="editorText"></textarea>

                <br><br>

                <button onclick="saveEggs()">Save Changes</button>

                <div class="status" id="saveStatus"></div>
            </div>
        </div>
    </div>


    <!-- RIGHT SIDE -->
    <div class="box right">
        <h2>Daily Easter Egg</h2>

        <div id="dailyEgg">
            Loading...
        </div>
    </div>

</div>


<script>

/*
=========================================================
SUPABASE SETTINGS
=========================================================

We will fill these in after connecting your website
to the Supabase project.

DO NOT change anything else yet.
=========================================================
*/

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";


/*
=========================================================
DEFAULT EASTER EGGS
=========================================================

These are only here so the page has something to show
before the Supabase connection is finished.

Once Supabase is connected, the online database will
become the permanent source.
=========================================================
*/

const defaultEggs = [
    {
        name: "Do a Barrel Roll",
        description: "Search Google for \"do a barrel roll\" and the page spins around."
    },
    {
        name: "Google in 1998",
        description: "Search Google for \"Google in 1998\" to see a retro version of Google."
    },
    {
        name: "Google Gravity",
        description: "Google Gravity makes the Google page fall apart and drop onto the screen."
    },
    {
        name: "Minecraft",
        description: "Google has had Minecraft-themed Easter eggs and interactive search experiences."
    }
];


/*
=========================================================
CURRENT EASTER EGGS
=========================================================
*/

let eggs = [];


/*
=========================================================
LOAD EASTER EGGS
=========================================================
*/

async function loadEggs() {

    /*
    If Supabase hasn't been connected yet,
    use the default list.
    */

    if (
        SUPABASE_URL === "YOUR_SUPABASE_URL" ||
        SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
    ) {
        eggs = defaultEggs;
        displayEverything();
        return;
    }


    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/easter_eggs?select=id,data&limit=1",
            {
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": "Bearer " + SUPABASE_ANON_KEY
                }
            }
        );


        if (!response.ok) {
            throw new Error("Database request failed.");
        }


        const result = await response.json();


        if (result.length === 0) {
            eggs = [];
        }
        else if (Array.isArray(result[0].data)) {
            eggs = result[0].data;
        }
        else {
            eggs = [];
        }


        displayEverything();

    }
    catch (error) {

        console.error(error);

        eggs = defaultEggs;

        displayEverything();
    }
}


/*
=========================================================
DISPLAY DOCUMENT
=========================================================
*/

function displayDocument() {

    const documentBox = document.getElementById("document");

    if (eggs.length === 0) {

        documentBox.innerHTML =
            '<div class="empty">More easter eggs being found.</div>';

        return;
    }


    documentBox.innerHTML = "";


    eggs.forEach((egg, index) => {

        const eggBox = document.createElement("div");

        eggBox.className = "egg";

        const title = document.createElement("h3");

        title.textContent =
            (index + 1) + ". " + egg.name;

        const description = document.createElement("p");

        description.textContent =
            egg.description;

        eggBox.appendChild(title);

        eggBox.appendChild(description);

        documentBox.appendChild(eggBox);
    });
}


/*
=========================================================
DAILY EASTER EGG
=========================================================
*/

function getTodayNumber() {

    const now = new Date();

    const start = new Date(
        now.getFullYear(),
        0,
        0
    );

    const difference =
        now - start;

    const oneDay =
        1000 * 60 * 60 * 24;

    return Math.floor(
        difference / oneDay
    );
}


function displayDailyEgg() {

    const dailyBox =
        document.getElementById("dailyEgg");


    if (eggs.length === 0) {

        dailyBox.innerHTML =
            '<div class="empty">More easter eggs being found.</div>';

        return;
    }


    /*
    The day number determines which egg appears.

    January 1 → first egg
    January 2 → second egg
    January 3 → third egg
    etc.

    Once we reach the end, it loops back around.
    */

    const dayNumber =
        getTodayNumber();

    const index =
        dayNumber % eggs.length;

    const egg =
        eggs[index];


    dailyBox.innerHTML = "";


    const eggBox =
        document.createElement("div");

    eggBox.className = "egg";


    const title =
        document.createElement("h3");

    title.textContent =
        egg.name;


    const description =
        document.createElement("p");

    description.textContent =
        egg.description;


    eggBox.appendChild(title);

    eggBox.appendChild(description);

    dailyBox.appendChild(eggBox);
}


/*
=========================================================
DISPLAY EVERYTHING
=========================================================
*/

function displayEverything() {

    displayDocument();

    displayDailyEgg();

    document.getElementById("editorText").value =
        JSON.stringify(eggs, null, 4);
}


/*
=========================================================
SECRET CODE
=========================================================
*/

function checkSecret() {

    const input =
        document.getElementById("secretInput").value;

    /*
    This is the secret code you requested.
    */

    if (input === "x☭ussr") {

        document.getElementById("editor").style.display =
            "block";

        document.getElementById("editorText").value =
            JSON.stringify(eggs, null, 4);

    }
    else {

        document.getElementById("editor").style.display =
            "none";
    }
}


/*
=========================================================
SAVE EASTER EGGS
=========================================================
*/

async function saveEggs() {

    const status =
        document.getElementById("saveStatus");

    try {

        const newEggs =
            JSON.parse(
                document.getElementById("editorText").value
            );


        if (!Array.isArray(newEggs)) {

            throw new Error(
                "The document must be a list of Easter Eggs."
            );
        }


        eggs = newEggs;


        /*
        If Supabase isn't connected yet,
        don't attempt the online save.
        */

        if (
            SUPABASE_URL === "YOUR_SUPABASE_URL" ||
            SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
        ) {

            status.textContent =
                "Saved on this page for now. Supabase still needs to be connected.";

            displayEverything();

            return;
        }


        /*
        Find the existing database row.
        */

        const getResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/easter_eggs?select=id&limit=1",
                {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization":
                            "Bearer " + SUPABASE_ANON_KEY
                    }
                }
            );


        const rows =
            await getResponse.json();


        /*
        If there isn't a row yet,
        create one.
        */

        if (rows.length === 0) {

            const insertResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/easter_eggs",
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization":
                                "Bearer " + SUPABASE_ANON_KEY,
                            "Content-Type":
                                "application/json",
                            "Prefer":
                                "return=minimal"
                        },

                        body: JSON.stringify({
                            data: eggs
                        })
                    }
                );


            if (!insertResponse.ok) {
                throw new Error("Could not create database row.");
            }

        }

        /*
        Otherwise update the existing row.
        */

        else {

            const id =
                rows[0].id;


            const updateResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/easter_eggs?id=eq." + id,
                    {
                        method: "PATCH",

                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization":
                                "Bearer " + SUPABASE_ANON_KEY,
                            "Content-Type":
                                "application/json",
                            "Prefer":
                                "return=minimal"
                        },

                        body: JSON.stringify({
                            data: eggs
                        })
                    }
                );


            if (!updateResponse.ok) {
                throw new Error("Could not save database.");
            }
        }


        status.textContent =
            "Changes saved successfully!";


        displayEverything();

    }
    catch (error) {

        console.error(error);

        status.textContent =
            "Error: " + error.message;
    }
}


/*
=========================================================
START
=========================================================
*/

loadEggs();

</script>

</body>
</html>
